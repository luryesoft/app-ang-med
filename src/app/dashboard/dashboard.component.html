<div class="dashboard">
  <div class="dashboard-hdr">
    <span class="dashboard-title">Work queues</span>
    <span class="dashboard-hint">One row per service. Click to open that visit.</span>
  </div>

  <div class="dashboard-loading" *ngIf="loading">
    <mat-spinner diameter="32"></mat-spinner>
  </div>

  <div class="dashboard-error" *ngIf="!loading && errorMessage">{{ errorMessage }}</div>

  <div class="queue-grid" *ngIf="!loading && !errorMessage">
    <section class="queue-card" *ngFor="let queue of queueViews">
      <div class="queue-hdr">
        <div>
          <div class="queue-title">{{ queue.title }}</div>
            <div class="queue-sub">{{ queue.hint }}</div>
        </div>
        <span class="queue-count">{{ countFor(queue.key) }}</span>
      </div>
      <div class="queue-empty" *ngIf="rowsFor(queue.key).length === 0">None</div>
      <button
        type="button"
        class="queue-row"
        *ngFor="let row of rowsFor(queue.key)"
        (click)="openPatient(row)">
        <div class="queue-row-main">
          <span class="queue-name">
            {{ row.ptn_last_nm }}, {{ row.ptn_first_nm }}
            <span class="queue-id">({{ row.ptn_id }})</span>
          </span>
          <span class="queue-service">{{ serviceLine(row) }}</span>
        </div>
        <div class="queue-row-side">
          <span class="status-chip" [ngClass]="statusClass(row.status)">{{ row.status }}</span>
          <span class="queue-extra" [class.queue-extra-aging]="queue.key === 'outstanding' && isAging(row)">{{ extraFor(queue.key, row) }}</span>
        </div>
      </button>
    </section>
  </div>
</div>
